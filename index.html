<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buen Dato</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .contenedor {
      width: 90%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    h1,
    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333333;
    }

    #avatar-usuario {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 18px;
      border: 4px solid #eeeeee;
    }

    #btn-cerrar-sesion {
      margin-top: 20px;
      background: #c62828;
    }

    #btn-cerrar-sesion:hover {
      background: #a51f1f;
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <!-- Vista inicial -->
    <section id="vista-inicio">
      <h1>Bienvenido a Buen Dato</h1>

      <p>
        Inicia sesión con tu cuenta de TikTok para continuar.
      </p>

      <button id="btn-tiktok" type="button">
        Continuar con TikTok
      </button>
    </section>

    <!-- Vista después del inicio de sesión -->
    <section id="vista-usuario" class="oculto">
      <img
        id="avatar-usuario"
        src=""
        alt="Foto de perfil de TikTok"
      >

      <h2 id="nombre-usuario">
        Usuario de TikTok
      </h2>

      <p>
        Tu cuenta de TikTok está conectada correctamente.
      </p>

      <button id="btn-cerrar-sesion" type="button">
        Cerrar sesión
      </button>
    </section>

  </main>

  <script>
    /*
     * URL del flujo /tiktok/start en n8n.
     * Debe redirigir al usuario hacia la autorización de TikTok.
     */
    const URL_INICIO_TIKTOK =
      'https://n8n.somosbuendato.com/webhook/tiktok/start';

    const vistaInicio = document.getElementById('vista-inicio');
    const vistaUsuario = document.getElementById('vista-usuario');
    const botonTikTok = document.getElementById('btn-tiktok');
    const botonCerrarSesion = document.getElementById('btn-cerrar-sesion');
    const nombreUsuario = document.getElementById('nombre-usuario');
    const avatarUsuario = document.getElementById('avatar-usuario');

    /*
     * Abre la autenticación en una ventana emergente.
     */
    botonTikTok.addEventListener('click', function () {
      const ancho = 500;
      const alto = 700;

      const izquierda =
        window.screenX + (window.outerWidth - ancho) / 2;

      const arriba =
        window.screenY + (window.outerHeight - alto) / 2;

      const popup = window.open(
        URL_INICIO_TIKTOK,
        'tiktok_login',
        'width=' + ancho +
        ',height=' + alto +
        ',left=' + izquierda +
        ',top=' + arriba +
        ',resizable=yes,scrollbars=yes'
      );

      if (!popup) {
        alert(
          'El navegador bloqueó la ventana emergente. ' +
          'Permite las ventanas emergentes para este sitio.'
        );
      }
    });

    /*
     * Muestra el usuario recibido desde n8n.
     */
    function mostrarUsuario(usuario) {
      if (!usuario || typeof usuario !== 'object') {
        console.error('Datos de usuario inválidos:', usuario);
        return;
      }

      const displayName =
        usuario.display_name || 'Usuario de TikTok';

      const avatarUrl =
        usuario.avatar_url || '';

      nombreUsuario.textContent = displayName;

      /*
       * La foto se obtiene dinámicamente desde TikTok.
       * No se utiliza ningún logo fijo.
       */
      if (avatarUrl) {
        avatarUsuario.src = avatarUrl;
        avatarUsuario.alt = 'Foto de perfil de ' + displayName;
        avatarUsuario.style.display = 'block';
      } else {
        avatarUsuario.removeAttribute('src');
        avatarUsuario.style.display = 'none';
      }

      vistaInicio.classList.add('oculto');
      vistaUsuario.classList.remove('oculto');

      localStorage.setItem(
        'tiktok_usuario',
        JSON.stringify({
          display_name: displayName,
          avatar_url: avatarUrl
        })
      );
    }

    /*
     * Recibe el mensaje enviado por el popup de n8n.
     */
    window.addEventListener('message', function (event) {
      console.log('Mensaje recibido:', event);
      console.log('Origen recibido:', event.origin);
      console.log('Datos recibidos:', event.data);

      /*
       * En condiciones normales el origen debería ser:
       * https://n8n.somosbuendato.com
       *
       * Se permite también "null" temporalmente porque tu popup
       * anteriormente estaba llegando con origen opaco.
       */
      const origenValido =
        event.origin === 'https://n8n.somosbuendato.com' ||
        event.origin === 'null';

      if (!origenValido) {
        console.warn('Origen rechazado:', event.origin);
        return;
      }

      if (
        !event.data ||
        event.data.type !== 'TIKTOK_LOGIN_EXITOSO'
      ) {
        console.warn('Tipo de mensaje no reconocido:', event.data);
        return;
      }

      mostrarUsuario(event.data.user);
    });

    /*
     * Carga la sesión guardada después de recargar la página.
     */
    function cargarUsuarioGuardado() {
      const usuarioGuardado =
        localStorage.getItem('tiktok_usuario');

      if (!usuarioGuardado) {
        return;
      }

      try {
        const usuario = JSON.parse(usuarioGuardado);
        mostrarUsuario(usuario);
      } catch (error) {
        console.error(
          'No se pudo leer el usuario guardado:',
          error
        );

        localStorage.removeItem('tiktok_usuario');
      }
    }

    /*
     * Cierra la sesión local.
     */
    botonCerrarSesion.addEventListener('click', function () {
      localStorage.removeItem('tiktok_usuario');

      avatarUsuario.removeAttribute('src');
      avatarUsuario.style.display = 'none';
      nombreUsuario.textContent = 'Usuario de TikTok';

      vistaUsuario.classList.add('oculto');
      vistaInicio.classList.remove('oculto');
    });

    cargarUsuarioGuardado();
  </script>

</body>
</html>
