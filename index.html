<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buen Dato - Iniciar sesión</title>

  <style>
    :root {
      --color-principal: #0f766e;
      --color-principal-hover: #115e59;
      --color-fondo: #f0fdfa;
      --color-texto: #1f2937;
      --color-secundario: #64748b;
      --color-blanco: #ffffff;
      --color-borde: #d1d5db;
      --color-error: #b91c1c;
      --sombra: 0 10px 30px rgba(15, 118, 110, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(
          135deg,
          #ecfeff 0%,
          #f0fdfa 50%,
          #ffffff 100%
        );
      color: var(--color-texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor-principal {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .tarjeta {
      padding: 36px 28px;
      background: var(--color-blanco);
      border-radius: 20px;
      box-shadow: var(--sombra);
    }

    .logo {
      display: block;
      width: 120px;
      max-width: 60%;
      height: auto;
      margin: 0 auto 24px;
      object-fit: contain;
    }

    .logo-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--color-principal);
      color: white;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    h2 {
      margin: 16px 0 8px;
      font-size: 22px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 24px;
      color: var(--color-secundario);
      line-height: 1.5;
    }

    .boton {
      width: 100%;
      min-height: 48px;
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--color-principal);
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .boton:hover {
      background: var(--color-principal-hover);
      transform: translateY(-1px);
    }

    .boton:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .boton-secundario {
      margin-top: 18px;
      background: transparent;
      color: var(--color-principal);
      border: 1px solid var(--color-principal);
    }

    .boton-secundario:hover {
      background: #f0fdfa;
      color: var(--color-principal-hover);
    }

    .usuario {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ccfbf1;
      background: #ccfbf1;
    }

    .avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ccfbf1;
      color: var(--color-principal);
      font-size: 40px;
      font-weight: bold;
    }

    .estado {
      min-height: 22px;
      margin-top: 14px;
      font-size: 14px;
      color: var(--color-secundario);
    }

    .estado.error {
      color: var(--color-error);
    }

    .pie {
      margin-top: 18px;
      color: var(--color-secundario);
      font-size: 13px;
    }

    .oculto {
      display: none !important;
    }

    @media (max-width: 480px) {
      .tarjeta {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor-principal">
    <section class="tarjeta" aria-live="polite">

      <!-- Estado inicial: usuario no autenticado -->
      <div id="vista-inicio">
        <!--
          Si tienes un logo real, reemplaza logo.png por su URL pública.
          Ejemplo:
          https://legal.somosbuendato.com/imagenes/logo.png
        -->
        <img
          id="logo-buen-dato"
          class="logo"
          src="logo.png"
          alt="Logo de Buen Dato"
          onerror="mostrarLogoAlternativo()"
        >

        <div
          id="logo-alternativo"
          class="logo-fallback oculto"
          aria-hidden="true"
        >
          BD
        </div>

        <h1>Bienvenido a Buen Dato</h1>

        <p>
          Inicia sesión con TikTok para continuar.
        </p>

        <button
          id="boton-tiktok"
          class="boton"
          type="button"
        >
          Continuar con TikTok
        </button>

        <div
          id="mensaje-estado"
          class="estado"
          role="status"
        ></div>
      </div>

      <!-- Estado autenticado: usuario conectado -->
      <div id="vista-usuario" class="usuario oculto">
        <div id="contenedor-avatar"></div>

        <h2 id="nombre-usuario">Usuario de TikTok</h2>

        <p>
          Tu cuenta de TikTok está conectada con Buen Dato.
        </p>

        <button
          id="boton-cerrar-sesion"
          class="boton boton-secundario"
          type="button"
        >
          Cerrar sesión
        </button>
      </div>

    </section>

    <div class="pie">
      Inicio de sesión seguro con TikTok
    </div>
  </main>

  <script>
    "use strict";

    /*
     * URLs principales
     */
    const URL_AUTORIZACION_TIKTOK =
      "https://n8n.somosbuendato.com/webhook/tiktok/start";

    const ORIGEN_N8N =
      "https://n8n.somosbuendato.com";

    const ORIGEN_SITIO =
      "https://legal.somosbuendato.com";

    const CLAVE_SESION =
      "tiktok_usuario";

    /*
     * Elementos de la página
     */
    const vistaInicio =
      document.getElementById("vista-inicio");

    const vistaUsuario =
      document.getElementById("vista-usuario");

    const botonTikTok =
      document.getElementById("boton-tiktok");

    const botonCerrarSesion =
      document.getElementById("boton-cerrar-sesion");

    const mensajeEstado =
      document.getElementById("mensaje-estado");

    const nombreUsuario =
      document.getElementById("nombre-usuario");

    const contenedorAvatar =
      document.getElementById("contenedor-avatar");

    /*
     * Escapa texto para evitar inyección HTML.
     */
    function escaparHTML(valor) {
      return String(valor || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /*
     * Obtiene las iniciales del nombre.
     */
    function obtenerIniciales(nombre) {
      const texto = String(nombre || "BD").trim();

      if (!texto) {
        return "BD";
      }

      const partes = texto
        .split(/\s+/)
        .filter(Boolean);

      if (partes.length === 1) {
        return partes[0].substring(0, 2).toUpperCase();
      }

      return (
        partes[0].charAt(0) +
        partes[1].charAt(0)
      ).toUpperCase();
    }

    /*
     * Muestra el logo alternativo si logo.png no existe.
     */
    function mostrarLogoAlternativo() {
      const logo =
        document.getElementById("logo-buen-dato");

      const logoAlternativo =
        document.getElementById("logo-alternativo");

      if (logo) {
        logo.classList.add("oculto");
      }

      if (logoAlternativo) {
        logoAlternativo.classList.remove("oculto");
      }
    }

    /*
     * Muestra mensajes de estado.
     */
    function mostrarEstado(mensaje, esError) {
      if (!mensajeEstado) {
        return;
      }

      mensajeEstado.textContent = mensaje || "";
      mensajeEstado.classList.toggle("error", Boolean(esError));
    }

    /*
     * Abre el popup de autenticación.
     */
    function iniciarLoginTikTok() {
      const ancho = 520;
      const alto = 720;

      const izquierda =
        window.screenX +
        Math.max(0, (window.outerWidth - ancho) / 2);

      const superior =
        window.screenY +
        Math.max(0, (window.outerHeight - alto) / 2);

      const configuracionPopup = [
        "width=" + ancho,
        "height=" + alto,
        "left=" + izquierda,
        "top=" + superior,
        "resizable=yes",
        "scrollbars=yes"
      ].join(",");

      const popup = window.open(
        URL_AUTORIZACION_TIKTOK,
        "tiktok_login",
        configuracionPopup
      );

      if (!popup) {
        mostrarEstado(
          "El navegador bloqueó la ventana emergente. Permite popups para este sitio.",
          true
        );
        return;
      }

      botonTikTok.disabled = true;
      botonTikTok.textContent = "Abriendo TikTok...";
      mostrarEstado("Esperando autorización de TikTok...", false);

      popup.focus();

      /*
       * Reactiva el botón si el usuario cierra el popup
       * sin terminar el inicio de sesión.
       */
      const revisarPopup = window.setInterval(function () {
        if (popup.closed) {
          window.clearInterval(revisarPopup);

          if (!localStorage.getItem(CLAVE_SESION)) {
            botonTikTok.disabled = false;
            botonTikTok.textContent = "Continuar con TikTok";
            mostrarEstado("", false);
          }
        }
      }, 1000);
    }

    /*
     * Dibuja el avatar del usuario.
     */
    function mostrarAvatar(usuario) {
      const avatarURL =
        typeof usuario.avatar_url === "string"
          ? usuario.avatar_url.trim()
          : "";

      const nombre =
        usuario.display_name || "Usuario de TikTok";

      const iniciales =
        escaparHTML(obtenerIniciales(nombre));

      if (avatarURL) {
        const avatarSeguro =
          escaparHTML(avatarURL);

        contenedorAvatar.innerHTML = `
          <img
            class="avatar"
            src="${avatarSeguro}"
            alt="Avatar de ${escaparHTML(nombre)}"
            referrerpolicy="no-referrer"
            onerror="this.classList.add('oculto'); this.nextElementSibling.classList.remove('oculto');"
          >
          <div class="avatar-fallback oculto" aria-hidden="true">
            ${iniciales}
          </div>
        `;

        return;
      }

      contenedorAvatar.innerHTML = `
        <div class="avatar-fallback" aria-hidden="true">
          ${iniciales}
        </div>
      `;
    }

    /*
     * Muestra la información del usuario autenticado.
     */
    function mostrarUsuario(usuario) {
      if (!usuario || typeof usuario !== "object") {
        return;
      }

      const nombre =
        String(
          usuario.display_name ||
          usuario.displayName ||
          usuario.name ||
          "Usuario de TikTok"
        ).trim();

      const avatar =
        String(
          usuario.avatar_url ||
          usuario.avatarUrl ||
          usuario.avatar ||
          ""
        ).trim();

      const usuarioNormalizado = {
        display_name: nombre,
        avatar_url: avatar
      };

      localStorage.setItem(
        CLAVE_SESION,
        JSON.stringify(usuarioNormalizado)
      );

      nombreUsuario.textContent = nombre;
      mostrarAvatar(usuarioNormalizado);

      vistaInicio.classList.add("oculto");
      vistaUsuario.classList.remove("oculto");

      botonTikTok.disabled = false;
      botonTikTok.textContent = "Continuar con TikTok";
      mostrarEstado("", false);
    }

    /*
     * Carga la sesión guardada.
     */
    function cargarSesion() {
      const sesionGuardada =
        localStorage.getItem(CLAVE_SESION);

      if (!sesionGuardada) {
        return;
      }

      try {
        const usuario =
          JSON.parse(sesionGuardada);

        mostrarUsuario(usuario);
      } catch (error) {
        console.error(
          "La sesión guardada no tiene un formato válido.",
          error
        );

        localStorage.removeItem(CLAVE_SESION);
      }
    }

    /*
     * Cierra la sesión local.
     */
    function cerrarSesion() {
      localStorage.removeItem(CLAVE_SESION);

      vistaUsuario.classList.add("oculto");
      vistaInicio.classList.remove("oculto");

      botonTikTok.disabled = false;
      botonTikTok.textContent = "Continuar con TikTok";

      mostrarEstado("Sesión cerrada.", false);
    }

    /*
     * Recibe el mensaje enviado por el popup de n8n.
     *
     * El HTML del nodo Respond to Webhook debe enviar:
     *
     * window.opener.postMessage(
     *   {
     *     type: "TIKTOK_LOGIN_EXITOSO",
     *     usuario: {
     *       display_name: "...",
     *       avatar_url: "..."
     *     }
     *   },
     *   "https://legal.somosbuendato.com"
     * );
     */
    window.addEventListener("message", function (evento) {
      /*
       * Solo acepta mensajes procedentes de n8n.
       */
      if (evento.origin !== ORIGEN_N8N) {
        console.warn(
          "Mensaje rechazado por origen no autorizado:",
          evento.origin
        );
        return;
      }

      if (!evento.data || typeof evento.data !== "object") {
        return;
      }

      if (
        evento.data.type !==
        "TIKTOK_LOGIN_EXITOSO"
      ) {
        return;
      }

      const usuario =
        evento.data.usuario ||
        evento.data.user ||
        evento.data;

      if (!usuario || typeof usuario !== "object") {
        mostrarEstado(
          "TikTok no devolvió los datos del usuario.",
          true
        );
        return;
      }

      mostrarUsuario(usuario);
    });

    /*
     * Eventos de botones.
     */
    botonTikTok.addEventListener(
      "click",
      iniciarLoginTikTok
    );

    botonCerrarSesion.addEventListener(
      "click",
      cerrarSesion
    );

    /*
     * Inicio de la página.
     */
    cargarSesion();
  </script>

</body>
</html>
