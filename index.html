<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Buen Dato - Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 26px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      object-fit: contain;
      border-radius: 50%;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0 0 24px;
      color: #666;
      line-height: 1.5;
    }

    .tiktok-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px 20px;
      background: #000000;
      color: #ffffff;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .tiktok-button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .tiktok-button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-avatar {
      width: 96px;
      height: 96px;
      margin-bottom: 16px;
      border-radius: 50%;
      object-fit: cover;
      background: #e8eaed;
      border: 3px solid #eeeeee;
    }

    .profile-name {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .logout-button {
      width: 100%;
      border: 1px solid #d93025;
      border-radius: 10px;
      padding: 12px 18px;
      background: #ffffff;
      color: #d93025;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .logout-button:hover {
      background: #fff3f2;
    }

    .message {
      min-height: 20px;
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }

    .message.error {
      color: #c5221f;
    }

    .message.success {
      color: #188038;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <!-- Puedes reemplazar esta imagen por tu logo -->
    <img
      class="logo"
      src="https://legal.somosbuendato.com/favicon.ico"
      alt="Buen Dato"
      onerror="this.style.display='none'"
    />

    <h1>Bienvenido a Buen Dato</h1>

    <p id="description">
      Inicia sesión con TikTok para continuar.
    </p>

    <section id="tiktok-login-container">
      <button
        id="boton-login-tiktok"
        class="tiktok-button"
        type="button"
      >
        Continuar con TikTok
      </button>

      <div id="message" class="message" role="status"></div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      /*
       * Este es el webhook que inicia el proceso OAuth.
       *
       * NO debe ser /callback.
       * El endpoint /callback solo debe ser utilizado por TikTok
       * después de la autorización.
       */
      const URL_AUTORIZACION_TIKTOK =
        "https://n8n.somosbuendato.com/webhook/tiktok/start";

      /*
       * Este debe coincidir con el targetOrigin usado en n8n:
       *
       * window.opener.postMessage(datos, "https://legal.somosbuendato.com")
       */
      const ORIGEN_N8N =
        "https://n8n.somosbuendato.com";

      const CLAVE_SESION =
        "buen_dato_tiktok_usuario";

      const botonLogin =
        document.getElementById("boton-login-tiktok");

      const contenedor =
        document.getElementById("tiktok-login-container");

      const descripcion =
        document.getElementById("description");

      const mensaje =
        document.getElementById("message");

      let ventanaPopup = null;

      function mostrarMensaje(texto, tipo = "") {
        mensaje.textContent = texto;
        mensaje.className = "message";

        if (tipo) {
          mensaje.classList.add(tipo);
        }
      }

      function escaparHTML(valor) {
        const elemento = document.createElement("div");
        elemento.textContent = valor == null ? "" : String(valor);
        return elemento.innerHTML;
      }

      function obtenerValor(datos, posiblesNombres) {
        for (const nombre of posiblesNombres) {
          if (
            datos &&
            datos[nombre] !== undefined &&
            datos[nombre] !== null &&
            datos[nombre] !== ""
          ) {
            return datos[nombre];
          }
        }

        return "";
      }

      function normalizarDatos(datosRecibidos) {
        let datos = datosRecibidos;

        /*
         * Permite recibir directamente el objeto o un objeto
         * dentro de data, user o usuario.
         */
        if (datos && typeof datos === "object") {
          if (datos.data && typeof datos.data === "object") {
            datos = datos.data;
          } else if (datos.user && typeof datos.user === "object") {
            datos = datos.user;
          } else if (
            datos.usuario &&
            typeof datos.usuario === "object"
          ) {
            datos = datos.usuario;
          }
        }

        const nombre = obtenerValor(datos, [
          "display_name",
          "displayName",
          "nickname",
          "name",
          "nombre"
        ]);

        const avatar = obtenerValor(datos, [
          "avatar_url",
          "avatarUrl",
          "avatar",
          "profile_image",
          "profile_image_url",
          "foto"
        ]);

        return {
          display_name: nombre || "Usuario de TikTok",
          avatar_url: avatar || "",
          open_id: obtenerValor(datos, [
            "open_id",
            "openId",
            "id"
          ])
        };
      }

      function mostrarUsuario(datosRecibidos) {
        const usuario = normalizarDatos(datosRecibidos);

        localStorage.setItem(
          CLAVE_SESION,
          JSON.stringify(usuario)
        );

        const nombreSeguro =
          escaparHTML(usuario.display_name);

        const avatarSeguro =
          escaparHTML(usuario.avatar_url);

        const avatarHTML = usuario.avatar_url
          ? `
            <img
              class="profile-avatar"
              src="${avatarSeguro}"
              alt="Foto de perfil"
              referrerpolicy="no-referrer"
              onerror="this.style.display='none'"
            />
          `
          : "";

        contenedor.innerHTML = `
          <div class="profile">
            ${avatarHTML}
            <h2 class="profile-name">
              ${nombreSeguro}
            </h2>

            <button
              id="cerrar-sesion-tiktok"
              class="logout-button"
              type="button"
            >
              Cerrar sesión
            </button>
          </div>
        `;

        descripcion.textContent =
          "Tu cuenta de TikTok está vinculada correctamente.";

        const botonCerrarSesion =
          document.getElementById("cerrar-sesion-tiktok");

        botonCerrarSesion.addEventListener(
          "click",
          cerrarSesion
        );
      }

      function cerrarSesion() {
        localStorage.removeItem(CLAVE_SESION);

        contenedor.innerHTML = `
          <button
            id="boton-login-tiktok"
            class="tiktok-button"
            type="button"
          >
            Continuar con TikTok
          </button>

          <div id="message" class="message" role="status"></div>
        `;

        descripcion.textContent =
          "Inicia sesión con TikTok para continuar.";

        window.location.reload();
      }

      function restaurarSesion() {
        const sesionGuardada =
          localStorage.getItem(CLAVE_SESION);

        if (!sesionGuardada) {
          return;
        }

        try {
          const usuario =
            JSON.parse(sesionGuardada);

          if (usuario && typeof usuario === "object") {
            mostrarUsuario(usuario);
          }
        } catch (error) {
          console.error(
            "No se pudo restaurar la sesión:",
            error
          );

          localStorage.removeItem(CLAVE_SESION);
        }
      }

      function abrirLoginTikTok() {
        mostrarMensaje("");

        const ancho = 600;
        const alto = 750;

        const izquierda =
          window.screenX +
          Math.max(
            0,
            (window.outerWidth - ancho) / 2
          );

        const superior =
          window.screenY +
          Math.max(
            0,
            (window.outerHeight - alto) / 2
          );

        ventanaPopup = window.open(
          URL_AUTORIZACION_TIKTOK,
          "buen_dato_tiktok_login",
          [
            `width=${ancho}`,
            `height=${alto}`,
            `left=${izquierda}`,
            `top=${superior}`,
            "resizable=yes",
            "scrollbars=yes",
            "noopener=no"
          ].join(",")
        );

        if (!ventanaPopup) {
          mostrarMensaje(
            "El navegador bloqueó la ventana emergente. Permite los popups para este sitio.",
            "error"
          );

          return;
        }

        botonLogin.disabled = true;
        botonLogin.textContent =
          "Esperando autorización...";

        const comprobarPopup = setInterval(() => {
          if (
            ventanaPopup &&
            ventanaPopup.closed
          ) {
            clearInterval(comprobarPopup);

            if (
              !localStorage.getItem(CLAVE_SESION)
            ) {
              botonLogin.disabled = false;
              botonLogin.textContent =
                "Continuar con TikTok";
            }
          }
        }, 1000);
      }

      /*
       * Recibe el mensaje enviado desde el callback de n8n.
       */
      window.addEventListener("message", (evento) => {
        if (evento.origin !== ORIGEN_N8N) {
          console.warn(
            "Mensaje rechazado por origen:",
            evento.origin
          );

          return;
        }

        const datos = evento.data || {};

        /*
         * Acepta estas variantes:
         *
         * { type: "TIKTOK_LOGIN_EXITOSO", ... }
         * { tipo: "TIKTOK_LOGIN_EXITOSO", ... }
         * { event: "TIKTOK_LOGIN_EXITOSO", ... }
         * { success: true, ... }
         */
        const tipoMensaje =
          datos.type ||
          datos.tipo ||
          datos.event ||
          datos.action ||
          "";

        const loginExitoso =
          tipoMensaje === "TIKTOK_LOGIN_EXITOSO" ||
          tipoMensaje === "TIKTOK_LOGIN_SUCCESS" ||
          datos.success === true ||
          datos.success === "true";

        if (!loginExitoso) {
          console.warn(
            "Mensaje recibido, pero no corresponde a un login exitoso:",
            datos
          );

          return;
        }

        mostrarUsuario(datos);

        mostrarMensaje(
          "Inicio de sesión exitoso.",
          "success"
        );

        if (
          ventanaPopup &&
          !ventanaPopup.closed
        ) {
          ventanaPopup.close();
        }
      });

      botonLogin.addEventListener(
        "click",
        abrirLoginTikTok
      );

      restaurarSesion();
    })();
  </script>
</body>
</html>
