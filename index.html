<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buen Dato | Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .tarjeta {
      background: #ffffff;
      border-radius: 18px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 150px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 22px;
      display: block;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    h2 {
      margin: 18px 0 8px;
      font-size: 23px;
    }

    p {
      color: #667085;
      line-height: 1.5;
      margin: 8px 0 22px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      background: #111111;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333333;
    }

    .boton-secundario {
      margin-top: 14px;
      background: #e9edf3;
      color: #172033;
    }

    .boton-secundario:hover {
      background: #dce2ea;
    }

    #vista-usuario {
      display: none;
    }

    #avatar-usuario {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 50%;
      display: none;
      margin: 0 auto;
      border: 4px solid #e6eaf0;
    }

    .estado {
      font-size: 14px;
      color: #667085;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <section class="tarjeta">

      <!--
        Reemplaza esta URL por la URL pública real de tu logo.
        Ejemplo:
        https://legal.somosbuendato.com/logo.png
      -->
      <img
        class="logo"
        src="https://legal.somosbuendato.com/logo.png"
        alt="Logo de Buen Dato"
        onerror="this.style.display='none';"
      >

      <!-- Vista para usuarios no autenticados -->
      <div id="vista-inicio">
        <h1>Bienvenido a Buen Dato</h1>

        <p>
          Inicia sesión con tu cuenta de TikTok para continuar.
        </p>

        <button type="button" id="btn-tiktok">
          Continuar con TikTok
        </button>
      </div>

      <!-- Vista para usuarios autenticados -->
      <div id="vista-usuario">
        <img
          id="avatar-usuario"
          src=""
          alt="Avatar del usuario"
        >

        <h2 id="nombre-usuario">Usuario de TikTok</h2>

        <p>
          Tu cuenta de TikTok está conectada correctamente.
        </p>

        <button
          type="button"
          class="boton-secundario"
          id="btn-cerrar-sesion"
        >
          Cerrar sesión
        </button>
      </div>

      <div class="estado" id="estado">
        <!-- Mensajes opcionales -->
      </div>

    </section>
  </main>

  <script>
    /*
     * URL que inicia el flujo OAuth en n8n.
     * Verifica que esta sea exactamente tu ruta pública.
     */
    const URL_INICIO_TIKTOK =
      'https://n8n.somosbuendato.com/webhook/tiktok/start';


    /*
     * Abre el flujo de TikTok en una ventana emergente.
     */
    function iniciarSesionTikTok() {
      const ancho = 600;
      const alto = 700;

      const izquierda =
        window.screenX + (window.outerWidth - ancho) / 2;

      const superior =
        window.screenY + (window.outerHeight - alto) / 2;

      const popup = window.open(
        URL_INICIO_TIKTOK,
        'tiktok_login',
        'width=' + ancho +
        ',height=' + alto +
        ',left=' + izquierda +
        ',top=' + superior +
        ',resizable=yes,scrollbars=yes'
      );

      if (!popup) {
        alert(
          'El navegador bloqueó la ventana emergente. ' +
          'Permite las ventanas emergentes para este sitio.'
        );
        return;
      }

      popup.focus();
    }


    /*
     * Muestra los datos del usuario en la página principal.
     */
    function mostrarUsuario(usuario) {
      if (!usuario || typeof usuario !== 'object') {
        console.error('Los datos del usuario no son válidos:', usuario);
        return;
      }

      const vistaInicio =
        document.getElementById('vista-inicio');

      const vistaUsuario =
        document.getElementById('vista-usuario');

      const nombreUsuario =
        document.getElementById('nombre-usuario');

      const avatarUsuario =
        document.getElementById('avatar-usuario');

      if (nombreUsuario) {
        nombreUsuario.textContent =
          usuario.display_name || 'Usuario de TikTok';
      }

      if (avatarUsuario) {
        if (usuario.avatar_url) {
          avatarUsuario.src = usuario.avatar_url;
          avatarUsuario.alt =
            usuario.display_name || 'Avatar de TikTok';
          avatarUsuario.style.display = 'block';
        } else {
          avatarUsuario.removeAttribute('src');
          avatarUsuario.style.display = 'none';
        }
      }

      if (vistaInicio) {
        vistaInicio.style.display = 'none';
      }

      if (vistaUsuario) {
        vistaUsuario.style.display = 'block';
      }
    }


    /*
     * Carga la sesión almacenada después de recargar la página.
     */
    function cargarUsuarioGuardado() {
      const usuarioGuardado =
        localStorage.getItem('tiktok_usuario');

      if (!usuarioGuardado) {
        return;
      }

      try {
        const usuario = JSON.parse(usuarioGuardado);
        mostrarUsuario(usuario);
      } catch (error) {
        console.error(
          'Error leyendo el usuario guardado:',
          error
        );

        localStorage.removeItem('tiktok_usuario');
      }
    }


    /*
     * Recibe el mensaje enviado por el popup de n8n.
     *
     * Se acepta "null" temporalmente porque tu navegador
     * está reportando ese origen para el popup.
     */
    window.addEventListener('message', function (event) {
      console.log('Mensaje recibido:', event);

      const origenPermitido =
        event.origin === 'https://n8n.somosbuendato.com' ||
        event.origin === 'null';

      if (!origenPermitido) {
        console.warn('Origen rechazado:', event.origin);
        return;
      }

      if (
        !event.data ||
        event.data.type !== 'TIKTOK_LOGIN_EXITOSO'
      ) {
        console.warn(
          'Mensaje ignorado. Tipo recibido:',
          event.data
        );
        return;
      }

      const usuario = event.data.user || event.data.usuario;

      if (!usuario) {
        console.error(
          'El mensaje no contiene user ni usuario:',
          event.data
        );
        return;
      }

      console.log('Usuario recibido:', usuario);

      localStorage.setItem(
        'tiktok_usuario',
        JSON.stringify(usuario)
      );

      mostrarUsuario(usuario);
    });


    /*
     * Configuración inicial de los botones.
     */
    document.addEventListener('DOMContentLoaded', function () {
      const botonTikTok =
        document.getElementById('btn-tiktok');

      const botonCerrarSesion =
        document.getElementById('btn-cerrar-sesion');

      if (botonTikTok) {
        botonTikTok.addEventListener(
          'click',
          iniciarSesionTikTok
        );
      }

      if (botonCerrarSesion) {
        botonCerrarSesion.addEventListener(
          'click',
          function () {
            localStorage.removeItem('tiktok_usuario');

            const vistaInicio =
              document.getElementById('vista-inicio');

            const vistaUsuario =
              document.getElementById('vista-usuario');

            const nombreUsuario =
              document.getElementById('nombre-usuario');

            const avatarUsuario =
              document.getElementById('avatar-usuario');

            if (vistaUsuario) {
              vistaUsuario.style.display = 'none';
            }

            if (vistaInicio) {
              vistaInicio.style.display = 'block';
            }

            if (nombreUsuario) {
              nombreUsuario.textContent =
                'Usuario de TikTok';
            }

            if (avatarUsuario) {
              avatarUsuario.removeAttribute('src');
              avatarUsuario.style.display = 'none';
            }
          }
        );
      }

      cargarUsuarioGuardado();
    });
  </script>

</body>
</html>
